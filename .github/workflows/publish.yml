name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build, test and pack, but don't upload)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - name: Refuse a real publish that isn't from a tag
        if: github.ref_type != 'tag' && inputs.dry_run == false
        run: |
          echo "::error::Publish by pushing a v* tag so every release has a tag and provenance; manual runs are dry runs only."
          exit 1
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      # Pinned so a bad npm release can't break publishing.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke
      - name: Publish
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            npm test && npm pack --dry-run
          else
            npm publish --provenance --access public
          fi
        # Trusted publishing is used when it's configured on npmjs.com; the token is a fallback.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
